<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>I.B.O.T. — Bestiary</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=VT323&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
</head>
<body class="dashboard-page">
  <div class="scanlines"></div>

  <nav class="top-nav">
    <span class="nav-logo">⬡ I.B.O.T.</span>
    <div class="nav-links">
      <a href="dashboard.html" class="nav-link">FIELD REPORTS</a>
      <a href="bestiary.html" class="nav-link active">BESTIARY</a>
      <a href="artifacts.html" class="nav-link">ARTIFACTS</a>
    </div>
    <button class="logout-btn" onclick="logout()">[ LOGOUT ]</button>
  </nav>

  <main class="dashboard-main">
    <div class="dashboard-header">
      <h1>KNOWN ENTITIES CATALOGUE</h1>
      <p class="subtitle-small">Classification Level: Amber-7 and below. Redacted entries require Violet clearance.</p>
    </div>

    <div id="loading-state" class="loading-container" style="display: none;">
      <p class="loading-text">ACCESSING BESTIARY DATABASE...</p>
      <div class="loading-bar"><div class="loading-fill"></div></div>
    </div>

    <div id="error-state" class="error-container" style="display: none;">
      <p class="error-text" id="error-message"></p>
      <button class="retry-btn" onclick="location.reload()">[ RETRY ]</button>
    </div>

    <div id="bestiary-grid" class="bestiary-grid"></div>
  </main>

  <script src="auth.js"></script>
  <script>
    if (!requireAuth()) return;

    const gridContainer = document.getElementById("bestiary-grid");
    const loadingState = document.getElementById("loading-state");
    const errorState = document.getElementById("error-state");
    const errorMessage = document.getElementById("error-message");

    loadingState.style.display = "block";

    fetchBestiary()
      .then(entities => {
        loadingState.style.display = "none";
        gridContainer.innerHTML = "";

        entities.forEach((entity, index) => {
          const card = document.createElement("div");
          card.className = `beast-card ${entity.redacted ? 'redacted' : ''}`;
          card.style.animationDelay = (index * 0.05) + "s";

          const threatBars = Array.from({length: 5}, (_, i) => 
            `<span class="bar ${i < (entity.threatLevel || 2) ? 'filled' : ''}"></span>`
          ).join("");

          const tagsHtml = (entity.tags || []).map(tag => `<span class="tag">${tag}</span>`).join("");

          card.innerHTML = `
            <div class="beast-emoji">${entity.emoji || '❓'}</div>
            <div class="threat-meter">
              <span class="threat-label">THREAT</span>
              <div class="meter-bars">${threatBars}</div>
            </div>
            <h3>${entity.name || "Unknown Entity"}</h3>
            <div class="beast-classification">${entity.classification || "CLASS: UNKNOWN"}</div>
            <p>${entity.description || "No description available."}</p>
            <div class="beast-tags">${tagsHtml}</div>
          `;
          gridContainer.appendChild(card);
        });
      })
      .catch(error => {
        loadingState.style.display = "none";
        errorState.style.display = "block";
        errorMessage.textContent = `SYSTEM ERROR: ${error.message || 'Failed to load bestiary'}`;
        console.error("Error loading bestiary:", error);
      });
  </script>
</body>
</html>
