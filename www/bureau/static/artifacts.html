<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>I.B.O.T. — Artifacts</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=VT323&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
</head>
<body class="dashboard-page">
  <div class="scanlines"></div>

  <nav class="top-nav">
    <span class="nav-logo">⬡ I.B.O.T.</span>
    <div class="nav-links">
      <a href="dashboard.html" class="nav-link">FIELD REPORTS</a>
      <a href="bestiary.html" class="nav-link">BESTIARY</a>
      <a href="artifacts.html" class="nav-link active">ARTIFACTS</a>
    </div>
    <button class="logout-btn" onclick="logout()">[ LOGOUT ]</button>
  </nav>

  <main class="dashboard-main">
    <div class="dashboard-header">
      <h1>RECOVERED ARTIFACTS VAULT</h1>
      <p class="subtitle-small">Items under active study. Do not touch without gloves and a firm sense of self.</p>
    </div>

    <div id="loading-state" class="loading-container" style="display: none;">
      <p class="loading-text">SCANNING ARTIFACT VAULT...</p>
      <div class="loading-bar"><div class="loading-fill"></div></div>
    </div>

    <div id="error-state" class="error-container" style="display: none;">
      <p class="error-text" id="error-message"></p>
      <button class="retry-btn" onclick="location.reload()">[ RETRY ]</button>
    </div>

    <div id="artifact-list" class="artifact-list"></div>
  </main>

  <script src="auth.js"></script>
  <script>
    if (!requireAuth()) return;

    const listContainer = document.getElementById("artifact-list");
    const loadingState = document.getElementById("loading-state");
    const errorState = document.getElementById("error-state");
    const errorMessage = document.getElementById("error-message");

    loadingState.style.display = "block";

    fetchArtifacts()
      .then(artifacts => {
        loadingState.style.display = "none";
        listContainer.innerHTML = "";

        artifacts.forEach((artifact, index) => {
          const row = document.createElement("div");
          row.className = `artifact-row ${artifact.redacted ? 'redacted' : ''}`;
          row.style.animationDelay = (index * 0.05) + "s";

          const statusClass = artifact.status
            ? artifact.status.toLowerCase().replace(/\s+/g, "-")
            : "unknown";

          row.innerHTML = `
            <div class="artifact-id">${artifact.id || "ART-???"}</div>
            <div class="artifact-icon">${artifact.icon || '❓'}</div>
            <div class="artifact-info">
              <h3>${artifact.name || "Unknown Artifact"}</h3>
              <p>${artifact.description || "No description available."}</p>
            </div>
            <div class="artifact-status status-${statusClass}">${artifact.status || "UNKNOWN"}</div>
          `;
          listContainer.appendChild(row);
        });
      })
      .catch(error => {
        loadingState.style.display = "none";
        errorState.style.display = "block";
        errorMessage.textContent = `SYSTEM ERROR: ${error.message || 'Failed to load artifacts'}`;
        console.error("Error loading artifacts:", error);
      });
  </script>
</body>
</html>
