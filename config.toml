
[engine]
max_events = 1024
max_timeout = 50
closing_timeout = 30
read_size = 4096
max_read_limit = 16384

[logging]
level = "DEBUG"
log_file = "log.txt"
tick_interval = 5

# --- Main Website (Port 8080) ---
[[servers]]
host = "localhost"
service = "8080"
server_name = "test"
root = "www"
max_body_size = 150000000

	[servers.errors]
	404 = "errors/404.html"
	500 = "errors/500.html"

	# Static files route
	[[servers.routes]]
	path = "/"
	methods = ["GET", "DELETE", "POST"]
	handler = "STATIC"
	index = "index.html"
	autoindex = true

	# File upload route
	[[servers.routes]]
	path = "/upload"
	methods = ["POST"]
	handler = "UPLOAD"
	max_body_size = 150000000
	allowed_extensions = []
	allow_overwrite = false
	upload_store = "./www/site1/uploads"

	[[servers.routes]]
	path = "/caffeine"
	methods = ["GET"]
	handler = "STATIC"
	alias = "/routes/test"
	index = "index.html"
	autoindex = true

